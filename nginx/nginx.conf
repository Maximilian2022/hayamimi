user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # アップストリーム定義
    upstream hayamimi_http {
        server hayamimi:8833;
    }

    upstream hayamimi_ws {
        server hayamimi:8766;
    }

    server {
        listen 8843 ssl;
        server_name _;

        # SSL証明書
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # WebSocket 音声送信エンドポイント (/ingest)
        location /ingest {
            proxy_pass http://hayamimi_ws/ingest;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # 配信中に切断されないようタイムアウトを長く設定
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # SSE (Server-Sent Events) 字幕イベントストリーム (/events)
        location /events {
            proxy_pass http://hayamimi_http/events;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # SSE 用のバッファリング無効化
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
        }

        # 通常のWeb画面 (/mic, /dashboard, /, /transcript など)
        location / {
            proxy_pass http://hayamimi_http;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            client_max_body_size 20M;
        }
    }
}
